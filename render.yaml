services:
  - type: web
    name: fithealth
    runtime: docker
    plan: free
    healthCheckPath: /login.html
    envVars:
      - key: PORT
        value: "8080"
      - key: TIDB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_DATABASE
        value: fithealth
      - key: TIDB_USER
        value: 4L1j4zQnAoK14UP.root
      - key: TIDB_PASSWORD
        sync: false
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: HIBERNATE_SHOW_SQL
        value: "false"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: DB_POOL_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: DB_POOL_IDLE_TIMEOUT_MS
        value: "300000"
      - key: DB_POOL_MAX_LIFETIME_MS
        value: "900000"
